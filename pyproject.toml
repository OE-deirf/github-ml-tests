[project]
name = "churn"
version = "0.4.0"
description = "MLSecOps course project"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3,<3",
    "numpy>=2.2.6,<3",
    "scikit-learn>=1.7.2,<2",
    "joblib>=1.6.0,<2",
    "pyyaml>=5.3.1,<7",
    "python-dotenv>=1.2.3,<2",
    "mlflow>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "dvc[s3]>=3.55,<4",
    "pre-commit>=4.0,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
